name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  guardrails:
    # Demonstrates the exit-code contract: the fixed mock must come back clean.
    # Gating a deploy on a sandbox instance of your own server works the same
    # way: any non-zero exit fails the step, including 3 ("every probe was
    # skipped, nothing was tested"). See the README before pointing it at
    # anything: the probes issue real charges.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: mcp-guardrail-probe --demo-safe --format json --out findings.json
      - uses: actions/upload-artifact@v4
        with:
          name: guardrail-findings
          path: findings.json
